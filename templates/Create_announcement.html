{% extends "base.html" %}

{% block content %}

<h2>Create Announcement</h2>

<form method="POST">

    <input type="text"
           name="title"
           class="form-control mb-2"
           placeholder="Title"
           required>

    <textarea name="message"
              class="form-control mb-2"
              rows="6"
              placeholder="Announcement"
              required></textarea>

    <button class="btn btn-success">
        Publish
    </button>

</form>

{% endblock %}
