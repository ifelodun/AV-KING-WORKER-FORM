{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4>

                Add Announcement

            </h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>

                        Title

                    </label>

                    <input
                    type="text"
                    name="title"
                    class="form-control"
                    required>

                </div>

                <div class="mb-3">

                    <label>

                        Message

                    </label>

                    <textarea
                    name="message"
                    class="form-control"
                    rows="5"
                    required></textarea>

                </div>

                <button
                class="btn btn-success">

                Publish Announcement

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
