{% extends "base.html" %}

{% block content %}

<h2>Company Announcements</h2>

{% for announcement in announcements %}

<div class="card mb-3">

<div class="card-body">

<h4>
{{announcement.title}}
</h4>

<p>
{{announcement.message}}
</p>

<small>
{{announcement.created_at}}
</small>

</div>

</div>

{% endfor %}

{% endblock %}
