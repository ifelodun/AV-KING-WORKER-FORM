{% extends "base.html" %}

{% block content %}

<h2>Attendance History</h2>

<table class="table">

<tr>

<th>Date</th>

<th>Clock In</th>

<th>Clock Out</th>

<th>Status</th>

</tr>

{% for record in records %}

<tr>

<td>
{{record.attendance_date}}
</td>

<td>
{{record.clock_in}}
</td>

<td>
{{record.clock_out}}
</td>

<td>
{{record.status}}
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
