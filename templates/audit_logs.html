{% extends "base.html" %}

{% block content %}

<h2>Audit Logs</h2>

<table class="table table-bordered">

<thead>

<tr>

<th>User</th>
<th>Action</th>
<th>Date</th>

</tr>

</thead>

<tbody>

{% for log in logs %}

<tr>

<td>
{{log.username}}
</td>

<td>
{{log.action}}
</td>

<td>
{{log.created_at}}
</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
