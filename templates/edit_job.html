{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Job</h2>

    <div class="card">
        <div class="card-body">

            <form method="POST">

                <label>Job Title</label>
                <input type="text"
                       name="title"
                       value="{{ job.title }}"
                       class="form-control mb-3"
                       required>

                <label>Department</label>
                <input type="text"
                       name="department"
                       value="{{ job.department }}"
                       class="form-control mb-3"
                       required>

                <label>Description</label>
                <textarea name="description"
                          class="form-control mb-3"
                          rows="4"
                          required>{{ job.description }}</textarea>

                <label>Requirements</label>
                <textarea name="requirements"
                          class="form-control mb-3"
                          rows="4"
                          required>{{ job.requirements }}</textarea>

                <label>Salary</label>
                <input type="text"
                       name="salary"
                       value="{{ job.salary }}"
                       class="form-control mb-3">

                <label>Location</label>
                <input type="text"
                       name="location"
                       value="{{ job.location }}"
                       class="form-control mb-3">

                <label>Deadline</label>
                <input type="date"
                       name="deadline"
                       value="{{ job.deadline }}"
                       class="form-control mb-3">

                <label>Status</label>
                <select name="status"
                        class="form-control mb-3">

                    <option value="Open"
                    {% if job.status == "Open" %}
                    selected
                    {% endif %}>
                    Open
                    </option>

                    <option value="Closed"
                    {% if job.status == "Closed" %}
                    selected
                    {% endif %}>
                    Closed
                    </option>

                </select>

                <button type="submit"
                        class="btn btn-primary">
                    Update Job
                </button>

                <a href="/jobs"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
