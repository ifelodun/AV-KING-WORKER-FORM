{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Jobs Management</h2>

    <!-- ADD JOB -->
    <div class="card mt-3">
        <div class="card-body">

            <h4>Add Job</h4>

            <form method="POST">

                <input type="text"
                       name="title"
                       class="form-control mb-2"
                       placeholder="Job Title"
                       required>

                <textarea name="description"
                          class="form-control mb-2"
                          placeholder="Job Description"
                          required></textarea>

                <button class="btn btn-success">
                    Add Job
                </button>

            </form>

        </div>
    </div>

    <!-- JOB LIST -->
    <div class="mt-4">

        <h4>All Jobs</h4>

        {% for job in jobs %}

        <div class="card mt-2">
            <div class="card-body">

                <!-- EDIT FORM -->
                <form method="POST" action="/edit-job/{{ job.id }}">

                    <input type="text"
                           name="title"
                           value="{{ job.title }}"
                           class="form-control mb-2">

                    <textarea name="description"
                              class="form-control mb-2">{{ job.description }}</textarea>

                    <button class="btn btn-primary btn-sm">
                        Update
                    </button>

                    <a href="/delete-job/{{ job.id }}"
                       class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </form>

            </div>
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
