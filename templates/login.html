{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<h3>Login</h3>

<form method="POST">

<input
class="form-control mb-3"
name="username"
placeholder="Username">

class="form-control mb-3"

placeholder="Password">

class="btn btn-primary w-100">

Login

</button>

</form>

<a href="/forgot-password">
Forgot Password?
</a>

</div>

</div>

{% endblock %}
