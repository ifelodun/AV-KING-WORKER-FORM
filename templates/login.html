{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 mt-5">

                <div class="card-body p-4">

                    <div class="text-center">

                        {% if settings and settings.logo %}
                        <img
                            src="{{ url_for('static',
                            filename='uploads/' + settings.logo) }}"
                            width="100"
                            class="mb-3">
                        {% endif %}

                        <h3>Login</h3>

                        <p class="text-muted">
                            Human Resource Management System
                        </p>

                    </div>

                    <form method="POST">

                        <input
                            type="text"
                            name="username"
                            class="form-control mb-3"
                            placeholder="Username"
                            required>

                        <input
                            type="password"
                            name="password"
                            class="form-control mb-3"
                            placeholder="Password"
                            required>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>

                    <div class="text-center mt-3">

                        <a href="/forgot-password">
                            Forgot Password?
                        </a>

                    </div>

                    <hr>

                    <div class="text-center">

                        <a href="/"
                           class="btn btn-outline-secondary">

                           ← Back to Home

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
