{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-4">

        <div class="card mt-5">

            <div class="card-body">

                <h3 class="text-center mb-4">
                    Login
                </h3>

                <form method="POST">

                    <input
                        type="text"
                        name="username"
                        class="form-control mb-3"
                        placeholder="Username"
                        required>

                    <input
                        type="password"
                        name="password"
                        class="form-control mb-3"
                        placeholder="Password"
                        required>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="/forgot-password">

                        Forgot Password?

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
