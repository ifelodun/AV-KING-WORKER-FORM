{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        Schedule Interview
                    </h4>

                </div>

                <div class="card-body">

                    <div class="alert alert-info">

                        <h5>
                            Applicant Information
                        </h5>

                        <hr>

                        <p>
                            <strong>Application No:</strong>
                            {{ application.application_number }}
                        </p>

                        <p>
                            <strong>Full Name:</strong>
                            {{ application.fullname }}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            {{ application.email }}
                        </p>

                        <p>
                            <strong>Phone:</strong>
                            {{ application.phone }}
                        </p>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Interview Date
                            </label>

                            <input
                                type="date"
                                name="interview_date"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Interview Time
                            </label>

                            <input
                                type="time"
                                name="interview_time"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Venue
                            </label>

                            <textarea
                                name="venue"
                                class="form-control"
                                rows="3"
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Interviewer
                            </label>

                            <input
                                type="text"
                                name="interviewer"
                                class="form-control"
                                placeholder="Interviewer Name"
                                required>

                        </div>

                        <div class="text-center">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Schedule Interview

                            </button>

                            <a href="/applications"
                               class="btn btn-secondary">

                                Back

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
